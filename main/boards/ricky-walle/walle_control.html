<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WALL-E Control</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0b0f14;color:#d7eef7;font-family:system-ui,-apple-system,sans-serif;min-height:100%}
body{padding:12px 12px 24px;max-width:480px;margin:0 auto}
h1{margin:0;font-size:18px;letter-spacing:.12em;color:#5ce1ff}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;display:inline-block;margin-right:6px;box-shadow:0 0 8px #ff4d4d}
.dot.on{background:#3dff9a;box-shadow:0 0 8px #3dff9a}
.card{background:#141b22;border:1px solid #1e2c38;border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:12px;color:#8aa3b5;display:flex;gap:12px;flex-wrap:wrap}
label{font-size:11px;color:#7fd7ff;letter-spacing:.08em}
input[type=range]{width:100%;accent-color:#5ce1ff}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button,.btn{flex:1;min-width:52px;border:0;border-radius:10px;padding:10px 8px;background:#1c2732;color:#d7eef7;font-weight:700}
.seg button.on{background:#0e4c63;color:#5ce1ff}
.pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.pad button{height:64px;font-size:22px;border-radius:14px;background:#1a2430;color:#5ce1ff;border:1px solid #234}
.pad .stop{background:#7a1020;color:#fff;font-size:16px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions button{background:#243041}
.purple{background:#4b2d7a!important}
.blue{background:#1a4d73!important}
.green{background:#145c3a!important}
.red{background:#7a1020!important}
.log{height:72px;overflow:auto;background:#070b0e;border-radius:8px;padding:8px;font-size:11px;color:#7fd7ff;font-family:ui-monospace,monospace}
.joy{width:180px;height:180px;border-radius:50%;margin:8px auto;background:radial-gradient(#0f1820,#0a1016);border:2px solid #2a4a5c;position:relative;touch-action:none}
.knob{width:64px;height:64px;border-radius:50%;background:#1c6d8a;position:absolute;left:58px;top:58px;pointer-events:none;box-shadow:0 0 16px #5ce1ff88}
.hint{font-size:11px;color:#6a8496;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="top">
  <h1>WALL-E PANEL</h1>
  <div><span id="dot" class="dot"></span><span id="conn">OFF</span></div>
</div>
<div class="card status">
  <span>PIN: <b id="bat">--</b></span>
  <span>IP: <b id="ip">--</b></span>
  <span>MCU: ESP32-S3</span>
</div>
<div class="card">
  <div class="row"><label>SPEED</label><b id="spdVal">50</b></div>
  <input id="spd" type="range" min="10" max="90" value="50">
  <label>DURATION</label>
  <div class="seg" id="durs"></div>
</div>
<div class="card">
  <div class="pad">
    <button data-a="look_left">◀</button>
    <button data-a="forward">▲</button>
    <button data-a="look_right">▶</button>
    <button data-a="turn_left">↺</button>
    <button class="stop" data-a="stop">STOP</button>
    <button data-a="turn_right">↻</button>
    <button data-a="arms_up">ARM ▲</button>
    <button data-a="backward">▼</button>
    <button data-a="arms_down">ARM ▼</button>
  </div>
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  <div class="hint" id="joyHint">JOYSTICK · IDLE</div>
  <div class="actions">
    <button class="purple" data-a="arms_wave">VẪY TAY</button>
    <button class="blue" data-a="nod">GẬT ĐẦU</button>
    <button class="green" data-a="look_center">NHÌN GIỮA</button>
    <button class="red" data-a="home">HOME</button>
  </div>
</div>
<div class="card">
  <div class="row"><label>LOG</label><button class="btn" id="clr" style="flex:0">CLEAR</button></div>
  <div class="log" id="log"></div>
  <div class="hint">W/S tiến lùi · A/D quay · Q/E đầu · Space STOP</div>
</div>
<script>
const $ = s => document.querySelector(s);
const logEl = $('#log'), spd = $('#spd'), spdVal = $('#spdVal');
let duration = 800, hold = false, ws = null, mcpId = 1;
const durs = [800,1000,3000,5000,0];
const durL = ['0.8s','1s','3s','5s','∞'];
function log(m){ const t=new Date().toLocaleTimeString(); logEl.innerHTML += t+' '+m+'<br>'; logEl.scrollTop=logEl.scrollHeight; }
function setConn(on){ $('#dot').classList.toggle('on',on); $('#conn').textContent = on?'ON':'OFF'; }
spd.oninput = () => spdVal.textContent = spd.value;
const durBox = $('#durs');
durs.forEach((d,i)=>{
  const b=document.createElement('button'); b.textContent=durL[i];
  if(i===0) b.className='on';
  b.onclick=()=>{ [...durBox.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); duration=d; hold=(d===0); };
  durBox.appendChild(b);
});
async function postAction(args){
  try{
    const r = await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});
    if(!r.ok) throw new Error(r.status);
    log(args.action||args.tool||'ok');
  }catch(e){ log('ERR '+e.message); }
}
function go(action, extra={}){
  const body = {action, speed:+spd.value, duration: hold?0:duration, direction:0, amount:30, steps:3, ...extra};
  return postAction(body);
}
document.querySelectorAll('[data-a]').forEach(btn=>{
  const a = btn.dataset.a;
  const move = ['forward','backward','turn_left','turn_right'].includes(a);
  btn.addEventListener('pointerdown', e=>{
    e.preventDefault();
    if(a==='stop') return go('stop');
    if(move && hold) go(a);
    else if(!move || !hold) go(a);
  });
  btn.addEventListener('pointerup', e=>{
    if(move && hold && a!=='stop') go('stop');
  });
  btn.addEventListener('pointerleave', e=>{
    if(move && hold && a!=='stop') go('stop');
  });
});
$('#clr').onclick=()=>{ logEl.innerHTML=''; };
async function poll(){
  try{
    const r = await fetch('/api/status'); const j = await r.json();
    setConn(true); $('#bat').textContent=(j.level??'--')+'%'+(j.charging?' ⚡':''); $('#ip').textContent=j.ip||'--';
  }catch(e){ setConn(false); }
}
setInterval(poll, 2000); poll();
function connectWs(){
  try{
    ws = new WebSocket('ws://'+location.host+'/ws');
    ws.onopen=()=>{ setConn(true); log('WS connected'); };
    ws.onclose=()=>{ log('WS closed'); setTimeout(connectWs,2000); };
    ws.onerror=()=>log('WS error');
  }catch(e){ log('WS '+e.message); }
}
connectWs();
const joy=$('#joy'), knob=$('#knob'), hint=$('#joyHint');
let lastJoy=null;
function joyPos(e){
  const r=joy.getBoundingClientRect();
  const x=(e.clientX??e.touches[0].clientX)-r.left-r.width/2;
  const y=(e.clientY??e.touches[0].clientY)-r.top-r.height/2;
  const m=Math.min(Math.hypot(x,y),70);
  const a=Math.atan2(y,x); return {x:Math.cos(a)*m,y:Math.sin(a)*m,ang:a*180/Math.PI,m};
}
function setKnob(x,y){ knob.style.left=(58+x)+'px'; knob.style.top=(58+y)+'px'; }
function joyAction(p){
  if(p.m<24) return null;
  if(p.ang>-60 && p.ang<60) return 'turn_right';
  if(p.ang>120 || p.ang<-120) return 'turn_left';
  if(p.ang<-60 && p.ang>-120) return 'forward';
  return 'backward';
}
function onJoy(e){
  e.preventDefault();
  const t=e.touches?e.touches[0]:e; const p=joyPos(t); setKnob(p.x,p.y);
  const a=joyAction(p); hint.textContent=a?('JOYSTICK · '+a.toUpperCase()):'JOYSTICK · IDLE';
  if(a && a!==lastJoy){ lastJoy=a; go(a,{duration:0}); }
}
function endJoy(){ setKnob(0,0); hint.textContent='JOYSTICK · IDLE'; if(lastJoy){ go('stop'); lastJoy=null; } }
joy.addEventListener('pointerdown', onJoy);
joy.addEventListener('pointermove', e=>{ if(e.buttons) onJoy(e); });
joy.addEventListener('pointerup', endJoy);
joy.addEventListener('pointerleave', endJoy);
document.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='w') go('forward');
  else if(k==='s') go('backward');
  else if(k==='a') go('turn_left');
  else if(k==='d') go('turn_right');
  else if(k==='q') go('look_left');
  else if(k==='e') go('look_right');
  else if(k===' ') { e.preventDefault(); go('stop'); }
  else if(e.key==='ArrowUp'){ spd.value=Math.min(90,+spd.value+5); spdVal.textContent=spd.value; }
  else if(e.key==='ArrowDown'){ spd.value=Math.max(10,+spd.value-5); spdVal.textContent=spd.value; }
});
</script>
</body>
</html>
